  <title>Free</title>
  <style>
    :root { --background: #101010; --accent: #F47761; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; min-height: 100%; background: var(--background); }
    body { overflow: hidden; }
    main { position: relative; display: grid; place-items: center; width: 100%; min-height: 100vh; min-height: 100svh; overflow: hidden; background: var(--background); isolation: isolate; }
    main::before { content: ""; position: absolute; inset: -15%; z-index: -1; background: radial-gradient(ellipse at 3% 12%, rgba(244, 119, 97, .16), transparent 42%), radial-gradient(ellipse at 96% 90%, rgba(244, 119, 97, .13), transparent 44%); animation: glow 14s ease-in-out infinite alternate; }
    .art { display: block; width: 100%; height: 100vh; height: 100svh; object-fit: cover; object-position: center; user-select: none; -webkit-user-drag: none; pointer-events: none; animation: enter 1.45s cubic-bezier(.22, 1, .36, 1) both; }
    @media (max-aspect-ratio: 1/1) { .art { width: 100%; height: auto; object-fit: contain; } }
    @keyframes enter { from { opacity: 0; filter: blur(8px); transform: scale(1.03); } to { opacity: 1; filter: blur(0); transform: scale(1); } }
    @keyframes glow { from { opacity: .45; transform: scale(1); } to { opacity: .85; transform: scale(1.06); } }
    @media (prefers-reduced-motion: reduce) { .art, main::before { animation: none; } }
  </style>
