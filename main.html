<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #101113; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <canvas id="surface" aria-label="Draggable pill and container"></canvas>
  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('surface');
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) return;

      const MAX_PIXELS = 2_400_000;
      const MAX_DENSITY = 1.7;
      const MOTION_RESPONSE = 20;
      const MAX_VISUAL_LAG = 11;
      const LIQUID_FREQUENCY = 17;
      const LIQUID_DAMPING = 0.5;
      const IOR = 1.49;
      const SPECTRAL_IOR = [1.488, IOR, 1.492];
      const BACKDROP_Z = -48;
      const CAUSTIC_IRRADIANCE = 0.00145;
      const F0 = Math.pow((IOR - 1) / (IOR + 1), 2);
      const COLOR_STEPS = 8192;
      const srgbLinear = new Float32Array(256);
      const linearSrgb = new Uint8Array(COLOR_STEPS + 1);
      for (let i = 0; i < 256; i++) {
        const c = i / 255;
        srgbLinear[i] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      }
      for (let i = 0; i <= COLOR_STEPS; i++) {
        const c = i / COLOR_STEPS;
        linearSrgb[i] = Math.round(255 * (c <= 0.0031308
          ? c * 12.92 : 1.055 * c ** (1 / 2.4) - 0.055));
      }
      const encodeLinear = c => linearSrgb[Math.round(clamp(c, 0, 1) * COLOR_STEPS)];
      const LITTLE_ENDIAN = new Uint8Array(new Uint32Array([0x01020304]).buffer)[0] === 4;
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const pack = (r, g, b) => LITTLE_ENDIAN
        ? ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0
        : ((r << 24) | (g << 16) | (b << 8) | 255) >>> 0;

      const shapes = [
        { x: 0, y: 0, w: 340, h: 220, radius: 45, radiusMax: 45, shoulder: 58, depth: 8.6, crown: 18.5, waveX: 0, waveY: 0, waveVX: 0, waveVY: 0, drawn: null },
        { x: 0, y: 0, w: 144, h: 48, radius: 24, radiusMax: 24, shoulder: 24, depth: 6.7, crown: 5.8, waveX: 0, waveY: 0, waveVX: 0, waveVY: 0, drawn: null }
      ];

      let viewportWidth = 1;
      let viewportHeight = 1;
      let previousViewportWidth = 1;
      let previousViewportHeight = 1;
      let rasterWidth = 1;
      let rasterHeight = 1;
      let scaleX = 1;
      let scaleY = 1;
      let framebuffer = null;
      let pixels = null;
      let bytes = null;
      let backdrop = null;
      let litBackdropPixels = null;
      let litBackdropBytes = null;
      let containerPixels = null;
      let containerBytes = null;
      let litContainerPixels = null;
      let litContainerBytes = null;
      let initialized = false;
      let fullRedraw = true;
      let frameRequested = false;
      let lastFrameTime = null;
      let drag = null;
      let backdropSource = null;
      let activeMotion = false;

      function distanceToShape(x, y, shape) {
        const hx = shape.w * 0.5;
        const hy = shape.h * 0.5;
        const bx = x - shape.x - hx;
        const by = y - shape.y - hy;
        let dx = bx;
        let dy = by;
        if (shape.waveX || shape.waveY) {
          const u = bx / hx;
          const v = by / hy;
          dx -= shape.waveX * (v * v - 0.24) + 0.16 * shape.waveY * u * v;
          dy -= shape.waveY * (u * u - 0.24) + 0.16 * shape.waveX * u * v;
        }
        const qx = Math.abs(dx) - (hx - shape.radius);
        const qy = Math.abs(dy) - (hy - shape.radius);
        return (qx > 0 && qy > 0 ? Math.hypot(qx, qy) : Math.max(qx, qy)) - shape.radius;
      }

      function sampleSurface(shape, x, y) {
        const hx = shape.w * 0.5;
        const hy = shape.h * 0.5;
        const bx = x - shape.x - hx;
        const by = y - shape.y - hy;
        let dx = bx;
        let dy = by;
        if (shape.waveX || shape.waveY) {
          const u = bx / hx;
          const v = by / hy;
          dx -= shape.waveX * (v * v - 0.24) + 0.16 * shape.waveY * u * v;
          dy -= shape.waveY * (u * u - 0.24) + 0.16 * shape.waveX * u * v;
        }
        const qx = Math.abs(dx) - (hx - shape.radius);
        const qy = Math.abs(dy) - (hy - shape.radius);
        let distance;
        let nx;
        let ny;
        let contourCurvature = 0;

        if (qx > 0 && qy > 0) {
          const length = Math.hypot(qx, qy);
          const inverse = 1 / length;
          distance = length - shape.radius;
          nx = Math.sign(dx) * qx * inverse;
          ny = Math.sign(dy) * qy * inverse;
          contourCurvature = inverse;
        } else if (qx >= qy) {
          distance = qx - shape.radius;
          nx = Math.sign(dx) || 1;
          ny = 0;
        } else {
          distance = qy - shape.radius;
          nx = 0;
          ny = Math.sign(dy) || 1;
        }

        if (distance >= 0) return null;

        const shoulder = Math.max(0.01, Math.min(shape.shoulder, hx, hy));
        const inset = Math.min(-distance, shoulder);
        const t = inset / shoulder;
        const smooth = t * t * t * (10 + t * (-15 + 6 * t));
        const slope = 30 * t * t * (1 - t) * (1 - t) / shoulder;
        const u = dx / hx;
        const v = dy / hy;
        const u2 = Math.max(0, 1 - u * u);
        const v2 = Math.max(0, 1 - v * v);
        const crownWeight = u2 * v2;
        const crown = shape.crown * smooth * smooth;
        const height = shape.depth * 0.5 * smooth + crown * crownWeight;
        const radialSlope = (shape.depth * 0.5 + 2 * shape.crown * smooth * crownWeight) * slope;
        const gx = radialSlope * nx + crown * 2 * u * v2 / hx;
        const gy = radialSlope * ny + crown * 2 * v * u2 / hy;
        const inverseLength = 1 / Math.hypot(gx, gy, 1);
        const bend = inset < shoulder
          ? 30 * shape.depth * t * (1 - t) * (1 - 2 * t) / (shoulder * shoulder)
          : 0;

        return {
          distance,
          thickness: height * 2,
          frontZ: height,
          backZ: -height,
          frontNormal: [gx * inverseLength, gy * inverseLength, inverseLength],
          backNormal: [gx * inverseLength, gy * inverseLength, -inverseLength],
          edgeNormal: [nx, ny],
          meridianCurvature: bend * inverseLength * inverseLength * inverseLength,
          transverseCurvature: -radialSlope * contourCurvature * inverseLength
        };
      }

      function refract(ix, iy, iz, nx, ny, nz, ratio) {
        const cosine = -(ix * nx + iy * ny + iz * nz);
        const square = 1 - ratio * ratio * (1 - cosine * cosine);
        if (square < 0) return null;
        const perpendicular = ratio * cosine - Math.sqrt(square);
        return [
          ratio * ix + perpendicular * nx,
          ratio * iy + perpendicular * ny,
          ratio * iz + perpendicular * nz
        ];
      }

      function trace(shape, x, y, front, ior = IOR) {
        const entry = refract(0, 0, -1,
          front.frontNormal[0], front.frontNormal[1], front.frontNormal[2], 1 / ior);
        if (!entry || entry[2] >= -0.01) return null;

        let travel = front.thickness / -entry[2];
        let backX = x;
        let backY = y;
        let back = front;

        for (let i = 0; i < 4; i++) {
          backX = x + entry[0] * travel;
          backY = y + entry[1] * travel;
          back = sampleSurface(shape, backX, backY);
          if (!back) return null;

          const residual = front.frontZ + entry[2] * travel - back.backZ;
          if (Math.abs(residual) < 0.0005) break;
          const inverseNormalZ = 1 / back.frontNormal[2];
          const derivative = entry[2]
            - (back.frontNormal[0] * entry[0] + back.frontNormal[1] * entry[1]) * inverseNormalZ;
          if (Math.abs(derivative) < 0.02) return null;
          travel = Math.max(0, travel - residual / derivative);
        }

        backX = x + entry[0] * travel;
        backY = y + entry[1] * travel;
        back = sampleSurface(shape, backX, backY);
        if (!back) return null;
        if (Math.abs(front.frontZ + entry[2] * travel - back.backZ) > 0.06) return null;

        const exit = refract(entry[0], entry[1], entry[2],
          -back.backNormal[0], -back.backNormal[1], -back.backNormal[2], ior);
        if (!exit || exit[2] >= -0.01) return null;

        const distance = (back.backZ - BACKDROP_Z) / -exit[2];
        const sourceX = backX + exit[0] * distance;
        const sourceY = backY + exit[1] * distance;
        return Number.isFinite(sourceX) && Number.isFinite(sourceY)
          ? [sourceX, sourceY] : null;
      }

      function smoothstep(a, b, x) {
        const t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function microfacet(nx, ny, nz, lx, ly, lz) {
        const ndl = Math.max(0, nx * lx + ny * ly + nz * lz);
        if (ndl <= 0) return 0;
        const hx = lx;
        const hy = ly;
        const hz = lz + 1;
        const inverseHalf = 1 / Math.hypot(hx, hy, hz);
        const ndh = Math.max(0, (nx * hx + ny * hy + nz * hz) * inverseHalf);
        const vdh = hz * inverseHalf;
        const ndv = Math.max(0.001, nz);
        const alpha = 0.12;
        const a2 = alpha * alpha;
        const d = ndh * ndh * (a2 - 1) + 1;
        const distribution = a2 / (Math.PI * d * d);
        const k = 0.17;
        const visibility = ndl / (ndl * (1 - k) + k)
          * ndv / (ndv * (1 - k) + k);
        const fresnel = F0 + (1 - F0) * (1 - vdh) ** 5;
        return distribution * visibility * fresnel * ndl / (4 * ndl * ndv + 0.0001);
      }

      function environmentRadiance(nx, ny, nz, reflectance) {
        const rx = 2 * nz * nx;
        const ry = 2 * nz * ny;
        const rz = 2 * nz * nz - 1;
        const dome = 0.022 + 0.095 * smoothstep(-0.95, 0.2, -ry) + 0.05 * Math.max(0, rz);
        const horizon = (1 - smoothstep(0.05, 0.18, Math.abs(ry + 0.06))) * (0.22 + 0.78 * smoothstep(-0.75, 0.35, rz));
        const topRibbon = (1 - smoothstep(0.015, 0.09, Math.abs(ry + 0.79 - rx * 0.08)))
          * smoothstep(-1.02, -0.48, rx) * (1 - smoothstep(0.28, 0.92, rx));
        const leftRibbon = (1 - smoothstep(0.02, 0.12, Math.abs(rx + 0.74 + ry * 0.16)))
          * smoothstep(-0.92, -0.3, ry) * (1 - smoothstep(0.2, 0.88, ry));
        const rightRibbon = (1 - smoothstep(0.025, 0.135, Math.abs(rx - 0.82 + ry * 0.12)))
          * smoothstep(-0.88, -0.22, ry) * (1 - smoothstep(0.08, 0.86, ry));
        const base = dome + horizon * 0.18;
        const ribbons = topRibbon * 1.8 + leftRibbon * 1.1 + rightRibbon * 1.0;
        return reflectance * (base + ribbons);
      }

      function surfaceResponse(shape, x, y, surface) {
        const inset = -surface.distance;
        const rimWidth = Math.min(6.2, shape.h * 0.12, shape.radius * 0.22);
        const rim = 1 - smoothstep(0, rimWidth, inset);
        const edgeZ = 1 - rim * 0.985;
        const edgeXY = Math.sqrt(Math.max(0, 1 - edgeZ * edgeZ));
        const nx = surface.frontNormal[0] * (1 - rim) + surface.edgeNormal[0] * edgeXY;
        const ny = surface.frontNormal[1] * (1 - rim) + surface.edgeNormal[1] * edgeXY;
        const nz = surface.frontNormal[2] * (1 - rim) + edgeZ;
        const length = Math.hypot(nx, ny, nz);
        const ox = nx / length;
        const oy = ny / length;
        const oz = nz / length;
        const reflectance = F0 + (1 - F0) * (1 - oz) ** 5;
        const attenuation = Math.exp(-surface.thickness * 0.00065);
        const key = microfacet(ox, oy, oz, -0.38, -0.46, 0.802);
        const fill = microfacet(ox, oy, oz, 0.62, 0.13, 0.773);
        const kick = microfacet(ox, oy, oz, 0.08, -0.96, 0.265);
        const environment = environmentRadiance(ox, oy, oz, reflectance);
        const direction = clamp(0.5 - surface.edgeNormal[1] * 0.43 - surface.edgeNormal[0] * 0.15, 0, 1);
        const outerSheen = rim * rim * (0.009 + 0.043 * direction);
        const meniscus = smoothstep(1.2, 3.6, inset) * (1 - smoothstep(6.5, 13.0, inset));
        const innerSheen = meniscus * (0.005 + 0.018 * direction);
        const grazing = smoothstep(0.14, 0.75, 1 - oz) * (1 - smoothstep(8, 22, inset));
        const specular = Math.min(0.12, key * 0.52 + fill * 0.16 + kick * 0.12);
        const volume = (1 - rim * rim) * (0.0028 + 0.0036 * smoothstep(6, 23, inset));
        const light = Math.min(0.14, environment * 0.41) + specular + outerSheen + innerSheen
          + grazing * 0.008 + volume;
        return [reflectance, attenuation,
          light * 0.95, light * 0.99, light * 1.045];
      }

      function stableRayOffset(shape, surface, x, y, ior, traced) {
        const ratio = 1 - 1 / ior;
        const reach = Math.abs(BACKDROP_Z) + surface.thickness * 0.30;
        const normalX = surface.frontNormal[0] / surface.frontNormal[2];
        const normalY = surface.frontNormal[1] / surface.frontNormal[2];
        const rawX = normalX * ratio * reach;
        const rawY = normalY * ratio * reach;
        const magnitude = Math.hypot(rawX, rawY);
        const limit = shape.h < 80 ? 12 : 22;
        const compression = magnitude > 0.00001 ? limit * Math.tanh(magnitude / limit) / magnitude : 1;
        const analyticX = rawX * compression;
        const analyticY = rawY * compression;
        if (!traced) return [analyticX, analyticY];
        const dx = traced[0] - x;
        const dy = traced[1] - y;
        const mismatch = Math.hypot(dx - analyticX, dy - analyticY);
        const trust = 0.28 * (1 - smoothstep(2.2, 8.2, mismatch));
        return [analyticX + (dx - analyticX) * trust,
          analyticY + (dy - analyticY) * trust];
      }

      function prepareOptics(shape) {
        const columns = Math.ceil(shape.w * 1.25) + 1;
        const rows = Math.ceil(shape.h * 1.25) + 1;
        const stepX = shape.w / (columns - 1);
        const stepY = shape.h / (rows - 1);
        const values = new Float32Array(columns * rows * 6);
        const lighting = new Float32Array(columns * rows * 5);
        const valid = new Uint8Array(columns * rows);
        const inside = new Uint8Array(columns * rows);

        for (let y = 0; y < rows; y++) {
          const py = shape.y + Math.min(shape.h, y * stepY);
          for (let x = 0; x < columns; x++) {
            const px = shape.x + Math.min(shape.w, x * stepX);
            const surface = sampleSurface(shape, px, py);
            const cell = y * columns + x;
            const lightIndex = cell * 5;
            if (!surface) {
              lighting[lightIndex] = 1;
              continue;
            }
            inside[cell] = 1;
            lighting.set(surfaceResponse(shape, px, py, surface), lightIndex);
            const center = trace(shape, px, py, surface, IOR);
            valid[cell] = 1;
            const base = cell * 6;
            const disperse = surface.frontNormal[2] < 0.9965;
            const red = disperse ? trace(shape, px, py, surface, SPECTRAL_IOR[0]) : center;
            const blue = disperse ? trace(shape, px, py, surface, SPECTRAL_IOR[2]) : center;
            const r = stableRayOffset(shape, surface, px, py, SPECTRAL_IOR[0], red);
            const g = stableRayOffset(shape, surface, px, py, IOR, center);
            const b = stableRayOffset(shape, surface, px, py, SPECTRAL_IOR[2], blue);
            values[base] = r[0];
            values[base + 1] = r[1];
            values[base + 2] = g[0];
            values[base + 3] = g[1];
            values[base + 4] = b[0];
            values[base + 5] = b[1];
          }
        }

        for (let pass = 0; pass < 5; pass++) {
          let changes = 0;
          const revised = values.slice();
          const filled = valid.slice();
          for (let y = 1; y < rows - 1; y++) {
            for (let x = 1; x < columns - 1; x++) {
              const cell = y * columns + x;
              if (valid[cell] || !inside[cell]) continue;
              let count = 0;
              const sums = [0, 0, 0, 0, 0, 0];
              for (const neighbor of [cell - 1, cell + 1, cell - columns, cell + columns]) {
                if (!valid[neighbor]) continue;
                const i = neighbor * 6;
                for (let channel = 0; channel < 6; channel++) sums[channel] += values[i + channel];
                count++;
              }
              if (!count) continue;
              const index = cell * 6;
              for (let channel = 0; channel < 6; channel++) revised[index + channel] = sums[channel] / count;
              filled[cell] = 1;
              changes++;
            }
          }
          values.set(revised);
          valid.set(filled);
          if (!changes) break;
        }

        const focalLimit = shape.h < 80 ? 15 : 25;
        for (let cell = 0; cell < columns * rows; cell++) {
          if (!inside[cell] || !valid[cell]) continue;
          const offset = cell * 6;
          const dx = values[offset + 2];
          const dy = values[offset + 3];
          const magnitude = Math.hypot(dx, dy);
          const ratio = magnitude > 0.00001 ? focalLimit * Math.tanh(magnitude / focalLimit) / magnitude : 1;
          for (let channel = 0; channel < 6; channel += 2) {
            const spectralX = values[offset + channel];
            const spectralY = values[offset + channel + 1];
            const component = Math.hypot(spectralX, spectralY);
            const limit = focalLimit + 1.0;
            const spectralRatio = component > 0.00001 ? limit * Math.tanh(component / limit) / component : 1;
            const blend = channel === 2 ? ratio : spectralRatio;
            values[offset + channel] *= blend;
            values[offset + channel + 1] *= blend;
          }
        }

        const smoothed = values.slice();
        for (let row = 1; row < rows - 1; row++) {
          for (let col = 1; col < columns - 1; col++) {
            const cell = row * columns + col;
            if (!valid[cell]) continue;
            const top = cell - columns;
            const bottom = cell + columns;
            const left = cell - 1;
            const right = cell + 1;
            if (!valid[top] || !valid[bottom] || !valid[left] || !valid[right]) continue;
            const i = cell * 6;
            for (let component = 0; component < 6; component++) {
              const adjacent = (values[top * 6 + component] + values[bottom * 6 + component]
                + values[left * 6 + component] + values[right * 6 + component]) * 0.25;
              smoothed[i + component] = values[i + component] * 0.35 + adjacent * 0.65;
            }
          }
        }
        values.set(smoothed);
        for (let pass = 0; pass < 2; pass++) {
          const revised = values.slice();
          for (let row = 1; row < rows - 1; row++) {
            for (let col = 1; col < columns - 1; col++) {
              const cell = row * columns + col;
              if (!valid[cell]) continue;
              const neighbors = [cell - columns, cell + columns, cell - 1, cell + 1];
              if (neighbors.some(index => !valid[index])) continue;
              const i = cell * 6;
              for (let component = 0; component < 6; component++) {
                const adjacent = (values[neighbors[0] * 6 + component] + values[neighbors[1] * 6 + component]
                  + values[neighbors[2] * 6 + component] + values[neighbors[3] * 6 + component]) * 0.25;
                revised[i + component] = values[i + component] * 0.6 + adjacent * 0.4;
              }
            }
          }
          values.set(revised);
        }

        shape.optics = {
          columns, rows, values, lighting, inside, valid,
          stepX, stepY, inverseStepX: 1 / stepX,
          inverseStepY: 1 / stepY
        };
        prepareCaustics(shape);
      }

      function splatEnergy(field, width, height, x, y, channel, amount) {
        if (x < 0 || y < 0 || x >= width - 1 || y >= height - 1) return;
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        const u = x - ix;
        const v = y - iy;
        const first = (iy * width + ix) * 3 + channel;
        const second = first + width * 3;
        field[first] += amount * (1 - u) * (1 - v);
        field[first + 3] += amount * u * (1 - v);
        field[second] += amount * (1 - u) * v;
        field[second + 3] += amount * u * v;
      }

      function prepareCaustics(shape) {
        const optics = shape.optics;
        const { columns, rows, values, lighting, inside, valid, stepX, stepY } = optics;
        let maxDisplacement = 0;
        for (let cell = 0; cell < columns * rows; cell++) {
          if (!inside[cell] || !valid[cell]) continue;
          const index = cell * 6;
          for (let c = 0; c < 6; c += 2) {
            maxDisplacement = Math.max(maxDisplacement,
              Math.hypot(values[index + c], values[index + c + 1]));
          }
        }
        const margin = clamp(Math.ceil(maxDisplacement + 5), 8, 84);
        const width = Math.ceil(shape.w) + margin * 2 + 2;
        const height = Math.ceil(shape.h) + margin * 2 + 2;
        const energy = new Float32Array(width * height * 3);
        const weight = stepX * stepY;

        for (let y = 0; y < rows; y++) {
          const localY = y * stepY;
          for (let x = 0; x < columns; x++) {
            const cell = y * columns + x;
            if (!inside[cell] || !valid[cell]) continue;
            const localX = x * stepX;
            const base = cell * 6;
            const reflectance = clamp(lighting[cell * 5], 0, 1);
            const transmission = (1 - reflectance) * (1 - reflectance);
            for (let channel = 0; channel < 3; channel++) {
              const index = base + channel * 2;
              splatEnergy(energy, width, height, margin + localX, margin + localY, channel, -weight);
              splatEnergy(energy, width, height,
                margin + localX + values[index], margin + localY + values[index + 1],
                channel, weight * transmission);
            }
          }
        }

        const filtered = new Float32Array(energy.length);
        const weights = [1, 8, 28, 56, 70, 56, 28, 8, 1];
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const offset = (y * width + x) * 3;
            for (let k = -4; k <= 4; k++) {
              const px = clamp(x + k, 0, width - 1);
              const from = (y * width + px) * 3;
              const w = weights[k + 4] / 256;
              for (let c = 0; c < 3; c++) filtered[offset + c] += energy[from + c] * w;
            }
          }
        }
        const blurred = new Float32Array(energy.length);
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const offset = (y * width + x) * 3;
            for (let k = -4; k <= 4; k++) {
              const py = clamp(y + k, 0, height - 1);
              const from = (py * width + x) * 3;
              const w = weights[k + 4] / 256;
              for (let c = 0; c < 3; c++) blurred[offset + c] += filtered[from + c] * w;
            }
          }
        }
        const rowMin = new Int32Array(height).fill(width);
        const rowMax = new Int32Array(height).fill(-1);
        let minX = width;
        let minY = height;
        let maxX = -1;
        let maxY = -1;
        for (let y = 0; y < height; y++) {
          for (let x = 0; x < width; x++) {
            const index = (y * width + x) * 3;
            if (Math.max(Math.abs(blurred[index]), Math.abs(blurred[index + 1]),
              Math.abs(blurred[index + 2])) < 0.0028) continue;
            rowMin[y] = Math.min(rowMin[y], x);
            rowMax[y] = x;
            minX = Math.min(minX, x);
            minY = Math.min(minY, y);
            maxX = Math.max(maxX, x);
            maxY = Math.max(maxY, y);
          }
        }
        shape.caustic = {
          width, height, margin, energy: blurred, rowMin, rowMax,
          active: maxX < 0 ? null : { minX, minY, maxX, maxY, margin }
        };
      }

      function sampleLinearChannel(x, y, input, channel) {
        const px = clamp(x * scaleX - 0.5, 0, rasterWidth - 1);
        const py = clamp(y * scaleY - 0.5, 0, rasterHeight - 1);
        const left = Math.floor(px);
        const top = Math.floor(py);
        const right = Math.min(left + 1, rasterWidth - 1);
        const bottom = Math.min(top + 1, rasterHeight - 1);
        const u = px - left;
        const v = py - top;
        const i00 = (top * rasterWidth + left) * 4 + channel;
        const i10 = (top * rasterWidth + right) * 4 + channel;
        const i01 = (bottom * rasterWidth + left) * 4 + channel;
        const i11 = (bottom * rasterWidth + right) * 4 + channel;
        return (srgbLinear[input[i00]] * (1 - u) + srgbLinear[input[i10]] * u) * (1 - v)
          + (srgbLinear[input[i01]] * (1 - u) + srgbLinear[input[i11]] * u) * v;
      }

      function opticalColor(shape, x, y, input, edgeDistance) {
        const optics = shape.optics;
        let localX = x - shape.x;
        let localY = y - shape.y;
        if (shape.waveX || shape.waveY) {
          const u = (localX - shape.w * 0.5) / (shape.w * 0.5);
          const v = (localY - shape.h * 0.5) / (shape.h * 0.5);
          localX -= shape.waveX * (v * v - 0.24) + 0.16 * shape.waveY * u * v;
          localY -= shape.waveY * (u * u - 0.24) + 0.16 * shape.waveX * u * v;
        }
        const cx = clamp(localX * optics.inverseStepX, 0, optics.columns - 1);
        const cy = clamp(localY * optics.inverseStepY, 0, optics.rows - 1);
        const x0 = Math.floor(cx);
        const y0 = Math.floor(cy);
        const x1 = Math.min(x0 + 1, optics.columns - 1);
        const y1 = Math.min(y0 + 1, optics.rows - 1);
        const fx = cx - x0;
        const fy = cy - y0;
        const w00 = (1 - fx) * (1 - fy);
        const w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy;
        const w11 = fx * fy;
        const values = optics.values;
        const a = (y0 * optics.columns + x0) * 6;
        const b = (y0 * optics.columns + x1) * 6;
        const c = (y1 * optics.columns + x0) * 6;
        const d = (y1 * optics.columns + x1) * 6;
        const edgeFade = smoothstep(0, 1.1, -edgeDistance);
        const lighting = optics.lighting;
        const ia = (y0 * optics.columns + x0) * 5;
        const ib = (y0 * optics.columns + x1) * 5;
        const ic = (y1 * optics.columns + x0) * 5;
        const id = (y1 * optics.columns + x1) * 5;
        let reflectance;
        let attenuation;
        let lightR;
        let lightG;
        let lightB;
        if (edgeDistance > -1.5) {
          const surface = sampleSurface(shape, x, y);
          if (!surface) return pack(0, 0, 0);
          const direct = surfaceResponse(shape, x, y, surface);
          reflectance = direct[0];
          attenuation = direct[1];
          lightR = direct[2];
          lightG = direct[3];
          lightB = direct[4];
        } else {
          reflectance = lighting[ia] * w00 + lighting[ib] * w10
            + lighting[ic] * w01 + lighting[id] * w11;
          attenuation = lighting[ia + 1] * w00 + lighting[ib + 1] * w10
            + lighting[ic + 1] * w01 + lighting[id + 1] * w11;
          lightR = lighting[ia + 2] * w00 + lighting[ib + 2] * w10
            + lighting[ic + 2] * w01 + lighting[id + 2] * w11;
          lightG = lighting[ia + 3] * w00 + lighting[ib + 3] * w10
            + lighting[ic + 3] * w01 + lighting[id + 3] * w11;
          lightB = lighting[ia + 4] * w00 + lighting[ib + 4] * w10
            + lighting[ic + 4] * w01 + lighting[id + 4] * w11;
        }

        const centerX = values[a + 2] * w00 + values[b + 2] * w10
          + values[c + 2] * w01 + values[d + 2] * w11;
        const centerY = values[a + 3] * w00 + values[b + 3] * w10
          + values[c + 3] * w01 + values[d + 3] * w11;
        const redX = values[a] * w00 + values[b] * w10 + values[c] * w01 + values[d] * w11;
        const redY = values[a + 1] * w00 + values[b + 1] * w10 + values[c + 1] * w01 + values[d + 1] * w11;
        const blueX = values[a + 4] * w00 + values[b + 4] * w10 + values[c + 4] * w01 + values[d + 4] * w11;
        const blueY = values[a + 5] * w00 + values[b + 5] * w10 + values[c + 5] * w01 + values[d + 5] * w11;
        const refractionBody = smoothstep(3, 14, -edgeDistance);
        const refractScale = edgeFade * (1 + refractionBody * 0.13);
        const spectrum = 1 - smoothstep(1.5, 11, -edgeDistance);
        const shiftedRedX = centerX + (redX - centerX) * spectrum;
        const shiftedRedY = centerY + (redY - centerY) * spectrum;
        const shiftedBlueX = centerX + (blueX - centerX) * spectrum;
        const shiftedBlueY = centerY + (blueY - centerY) * spectrum;
        const transmission = (1 - reflectance) * attenuation;
        const red = sampleLinearChannel(x + shiftedRedX * refractScale, y + shiftedRedY * refractScale, input, 0);
        const green = sampleLinearChannel(x + centerX * refractScale, y + centerY * refractScale, input, 1);
        const blue = sampleLinearChannel(x + shiftedBlueX * refractScale, y + shiftedBlueY * refractScale, input, 2);
        return pack(
          encodeLinear(red * transmission + lightR),
          encodeLinear(green * transmission + lightG),
          encodeLinear(blue * transmission + lightB)
        );
      }

      function snapshot(shape) {
        return { x: shape.x, y: shape.y, w: shape.w, h: shape.h,
          waveX: shape.waveX, waveY: shape.waveY, influence: shape.caustic.margin };
      }

      function bounds(shape) {
        const x0 = clamp(Math.floor(shape.x * scaleX) - 2, 0, rasterWidth);
        const y0 = clamp(Math.floor(shape.y * scaleY) - 2, 0, rasterHeight);
        const x1 = clamp(Math.ceil((shape.x + shape.w) * scaleX) + 2, 0, rasterWidth);
        const y1 = clamp(Math.ceil((shape.y + shape.h) * scaleY) + 2, 0, rasterHeight);
        return x1 > x0 && y1 > y0 ? { x0, y0, x1, y1 } : null;
      }

      function mergeRectangles(rectangles) {
        const result = [];
        for (const rect of rectangles) {
          if (!rect) continue;
          let joined = rect;
          for (let i = 0; i < result.length;) {
            const current = result[i];
            if (joined.x0 <= current.x1 && current.x0 <= joined.x1
              && joined.y0 <= current.y1 && current.y0 <= joined.y1) {
              joined = {
                x0: Math.min(joined.x0, current.x0),
                y0: Math.min(joined.y0, current.y0),
                x1: Math.max(joined.x1, current.x1),
                y1: Math.max(joined.y1, current.y1)
              };
              result.splice(i, 1);
              i = 0;
            } else {
              i++;
            }
          }
          result.push(joined);
        }
        return result;
      }

      function prepareBackdrop() {
        if (!backdropSource) {
          for (let y = 0; y < rasterHeight; y++) {
            const sy = (y + 0.5) / scaleY;
            for (let x = 0; x < rasterWidth; x++) {
              const sx = (x + 0.5) / scaleX;
              const a = sx * 0.90 + sy * 0.31;
              const b = sy * 0.88 - sx * 0.19;
              const major = Math.abs(a - Math.round(a / 78) * 78);
              const minor = Math.abs(b - Math.round(b / 126) * 126);
              const stroke = 25 * clamp((1.8 - major) / 1.25, 0, 1)
                + 11 * clamp((1.2 - minor) / 0.9, 0, 1);
              const low = 8 + 10 * (1 - sy / viewportHeight) + 5.5 * Math.sin(a / 170) + 3.6 * Math.sin(b / 114);
              const value = Math.round(18 + low + stroke);
              backdrop[y * rasterWidth + x] = pack(value, value + 2, value + 6);
            }
          }
          return;
        }
        const { width: sw, height: sh, data } = backdropSource;
        const rowScale = sh / rasterHeight;
        const columnScale = sw / rasterWidth;
        for (let y = 0; y < rasterHeight; y++) {
          const sy = clamp((y + 0.5) * rowScale - 0.5, 0, sh - 1);
          const top = Math.floor(sy);
          const bottom = Math.min(top + 1, sh - 1);
          const fy = sy - top;
          for (let x = 0; x < rasterWidth; x++) {
            const sx = clamp((x + 0.5) * columnScale - 0.5, 0, sw - 1);
            const left = Math.floor(sx);
            const right = Math.min(left + 1, sw - 1);
            const fx = sx - left;
            const o00 = (top * sw + left) * 4;
            const o10 = (top * sw + right) * 4;
            const o01 = (bottom * sw + left) * 4;
            const o11 = (bottom * sw + right) * 4;
            const w00 = (1 - fx) * (1 - fy);
            const w10 = fx * (1 - fy);
            const w01 = (1 - fx) * fy;
            const w11 = fx * fy;
            backdrop[y * rasterWidth + x] = pack(
              Math.round(data[o00] * w00 + data[o10] * w10 + data[o01] * w01 + data[o11] * w11),
              Math.round(data[o00 + 1] * w00 + data[o10 + 1] * w10 + data[o01 + 1] * w01 + data[o11 + 1] * w11),
              Math.round(data[o00 + 2] * w00 + data[o10 + 2] * w10 + data[o01 + 2] * w01 + data[o11 + 2] * w11)
            );
          }
        }
      }

      function copyRegion(target, source, area) {
        for (let y = area.y0; y < area.y1; y++) {
          const start = y * rasterWidth + area.x0;
          target.set(source.subarray(start, start + area.x1 - area.x0), start);
        }
      }

      function affectedBounds(shape) {
        const margin = (shape.caustic ? shape.caustic.margin : shape.influence || 0) + 12;
        const x0 = clamp(Math.floor((shape.x - margin) * scaleX), 0, rasterWidth);
        const y0 = clamp(Math.floor((shape.y - margin) * scaleY), 0, rasterHeight);
        const x1 = clamp(Math.ceil((shape.x + shape.w + margin) * scaleX), 0, rasterWidth);
        const y1 = clamp(Math.ceil((shape.y + shape.h + margin) * scaleY), 0, rasterHeight);
        return x1 > x0 && y1 > y0 ? { x0, y0, x1, y1 } : null;
      }

      function applyCaustic(shape, dirty, output) {
        const map = shape.caustic;
        const area = affectedBounds(shape);
        if (!area) return;
        const x0 = Math.max(dirty.x0, area.x0);
        const y0 = Math.max(dirty.y0, area.y0);
        const x1 = Math.min(dirty.x1, area.x1);
        const y1 = Math.min(dirty.y1, area.y1);
        const { width, height, margin, energy, rowMin, rowMax } = map;
        const invX = 1 / scaleX;
        const invY = 1 / scaleY;
        for (let py = y0; py < y1; py++) {
          const mapY = (py + 0.5) * invY - shape.y + margin;
          if (mapY < 0 || mapY >= height - 1) continue;
          const top = Math.floor(mapY);
          const v = mapY - top;
          const first = Math.min(rowMin[top], rowMin[top + 1]);
          const last = Math.max(rowMax[top], rowMax[top + 1]);
          if (last < first) continue;
          const rowStart = Math.max(x0, Math.floor((shape.x + first - margin - 2) * scaleX));
          const rowEnd = Math.min(x1, Math.ceil((shape.x + last - margin + 2) * scaleX));
          for (let px = rowStart; px < rowEnd; px++) {
            const mapX = (px + 0.5) * invX - shape.x + margin;
            if (mapX < 0 || mapX >= width - 1) continue;
            const left = Math.floor(mapX);
            const u = mapX - left;
            const w00 = (1 - u) * (1 - v);
            const w10 = u * (1 - v);
            const w01 = (1 - u) * v;
            const w11 = u * v;
            const a = (top * width + left) * 3;
            const b = a + 3;
            const c = a + width * 3;
            const d = c + 3;
            const out = (py * rasterWidth + px) * 4;
            for (let channel = 0; channel < 3; channel++) {
              const delta = energy[a + channel] * w00 + energy[b + channel] * w10
                + energy[c + channel] * w01 + energy[d + channel] * w11;
              if (Math.abs(delta) < 0.003) continue;
              const radiance = srgbLinear[output[out + channel]]
                + CAUSTIC_IRRADIANCE * clamp(delta, -0.22, 2.0);
              output[out + channel] = encodeLinear(radiance);
            }
          }
        }
      }

      function paintShape(shape, dirty, input, output) {
        const area = bounds(shape);
        if (!area) return;

        const x0 = Math.max(area.x0, dirty.x0);
        const y0 = Math.max(area.y0, dirty.y0);
        const x1 = Math.min(area.x1, dirty.x1);
        const y1 = Math.min(area.y1, dirty.y1);
        if (x0 >= x1 || y0 >= y1) return;

        const halfDiagonal = 0.5 * Math.hypot(1 / scaleX, 1 / scaleY);
        const reciprocalX = 1 / scaleX;
        const reciprocalY = 1 / scaleY;
        const fineRaster = Math.min(scaleX, scaleY) >= 1.45 && !activeMotion;

        for (let py = y0; py < y1; py++) {
          const cy = (py + 0.5) * reciprocalY;
          for (let px = x0; px < x1; px++) {
            const cx = (px + 0.5) * reciprocalX;
            const signed = distanceToShape(cx, cy, shape);
            if (signed >= halfDiagonal) continue;

            let samples = signed > -halfDiagonal ? (fineRaster ? 2 : 4)
              : signed > -8 && !fineRaster ? 2 : 1;
            if (activeMotion && samples > 2) samples = 2;
            if (samples === 1) {
              const color = opticalColor(shape, cx, cy, input, signed);
              const outIndex = (py * rasterWidth + px) * 4;
              output[outIndex] = LITTLE_ENDIAN ? color & 255 : color >>> 24;
              output[outIndex + 1] = LITTLE_ENDIAN ? (color >>> 8) & 255 : (color >>> 16) & 255;
              output[outIndex + 2] = LITTLE_ENDIAN ? (color >>> 16) & 255 : (color >>> 8) & 255;
              output[outIndex + 3] = 255;
              continue;
            }

            const count = samples * samples;
            let totalR = 0;
            let totalG = 0;
            let totalB = 0;
            let covered = 0;

            for (let sy = 0; sy < samples; sy++) {
              const y = cy + (sy + 0.5 - samples * 0.5) * reciprocalY / samples;
              for (let sx = 0; sx < samples; sx++) {
                const x = cx + (sx + 0.5 - samples * 0.5) * reciprocalX / samples;
                const distance = distanceToShape(x, y, shape);
                if (distance >= 0) continue;
                covered++;
                const color = opticalColor(shape, x, y, input, distance);
                totalR += LITTLE_ENDIAN ? color & 255 : color >>> 24;
                totalG += LITTLE_ENDIAN ? (color >>> 8) & 255 : (color >>> 16) & 255;
                totalB += LITTLE_ENDIAN ? (color >>> 16) & 255 : (color >>> 8) & 255;
              }
            }

            if (!covered) continue;
            const outIndex = (py * rasterWidth + px) * 4;
            const inverse = 1 / count;
            const uncovered = (count - covered) * inverse;
            output[outIndex] = Math.round(output[outIndex] * uncovered + totalR * inverse);
            output[outIndex + 1] = Math.round(output[outIndex + 1] * uncovered + totalG * inverse);
            output[outIndex + 2] = Math.round(output[outIndex + 2] * uncovered + totalB * inverse);
            output[outIndex + 3] = 255;
          }
        }
      }

      function changed(shape) {
        const old = shape.drawn;
        return !old || old.x !== shape.x || old.y !== shape.y
          || old.w !== shape.w || old.h !== shape.h
          || (old.waveX || 0) !== shape.waveX
          || (old.waveY || 0) !== shape.waveY;
      }

      function render() {
        frameRequested = false;
        if (!framebuffer) return;

        const sceneDirty = [];
        const pillDirty = [];
        if (fullRedraw) {
          sceneDirty.push({ x0: 0, y0: 0, x1: rasterWidth, y1: rasterHeight });
        } else {
          if (changed(shapes[0])) {
            if (shapes[0].drawn) sceneDirty.push(affectedBounds(shapes[0].drawn));
            sceneDirty.push(affectedBounds(shapes[0]));
          }
          if (changed(shapes[1])) {
            if (shapes[1].drawn) pillDirty.push(affectedBounds(shapes[1].drawn));
            pillDirty.push(affectedBounds(shapes[1]));
          }
        }

        const sceneRegions = mergeRectangles(sceneDirty);
        for (const area of sceneRegions) {
          copyRegion(litBackdropPixels, backdrop, area);
          applyCaustic(shapes[0], area, litBackdropBytes);
          copyRegion(containerPixels, litBackdropPixels, area);
          paintShape(shapes[0], area, litBackdropBytes, containerBytes);
        }

        for (const area of mergeRectangles([...sceneRegions, ...pillDirty])) {
          copyRegion(litContainerPixels, containerPixels, area);
          applyCaustic(shapes[1], area, litContainerBytes);
          copyRegion(pixels, litContainerPixels, area);
          paintShape(shapes[1], area, litContainerBytes, bytes);
          context.putImageData(framebuffer, 0, 0,
            area.x0, area.y0, area.x1 - area.x0, area.y1 - area.y0);
        }

        for (const shape of shapes) shape.drawn = snapshot(shape);
        fullRedraw = false;
      }

      function advanceMotion(time) {
        const dt = lastFrameTime === null ? 16.667 : clamp(time - lastFrameTime, 1, 48);
        lastFrameTime = time;
        const response = 1 - Math.exp(-dt / MOTION_RESPONSE);
        const step = Math.min(dt * 0.001, 0.036);
        const frequency = LIQUID_FREQUENCY;
        const stiffness = frequency * frequency;
        const friction = 2 * LIQUID_DAMPING * frequency;
        let moving = false;
        for (const shape of shapes) {
          const dx = shape.targetX - shape.x;
          const dy = shape.targetY - shape.y;
          let nextX = shape.x;
          let nextY = shape.y;
          if (Math.abs(dx) + Math.abs(dy) < 0.075) {
            nextX = shape.targetX;
            nextY = shape.targetY;
          } else {
            nextX += dx * response;
            nextY += dy * response;
            const remainingX = shape.targetX - nextX;
            const remainingY = shape.targetY - nextY;
            const lag = Math.hypot(remainingX, remainingY);
            if (lag > MAX_VISUAL_LAG) {
              const ratio = MAX_VISUAL_LAG / lag;
              nextX = shape.targetX - remainingX * ratio;
              nextY = shape.targetY - remainingY * ratio;
            }
            moving = true;
          }
          const motionX = nextX - shape.x;
          const motionY = nextY - shape.y;
          shape.x = nextX;
          shape.y = nextY;
          const wantedX = clamp((motionX / Math.max(1, dt)) * 24, -4.4, 4.4);
          const wantedY = clamp((motionY / Math.max(1, dt)) * 24, -4.4, 4.4);
          shape.waveVX += ((wantedX - shape.waveX) * stiffness - shape.waveVX * friction) * step;
          shape.waveVY += ((wantedY - shape.waveY) * stiffness - shape.waveVY * friction) * step;
          shape.waveX = clamp(shape.waveX + shape.waveVX * step, -4.8, 4.8);
          shape.waveY = clamp(shape.waveY + shape.waveVY * step, -4.8, 4.8);
          if (Math.abs(shape.waveX) + Math.abs(shape.waveY) > 0.035
            || Math.abs(shape.waveVX) + Math.abs(shape.waveVY) > 0.2) moving = true;
          else {
            shape.waveX = 0;
            shape.waveY = 0;
            shape.waveVX = 0;
            shape.waveVY = 0;
          }
        }
        return moving;
      }

      function tick(time) {
        frameRequested = false;
        const moving = advanceMotion(time);
        activeMotion = moving || !!drag;
        render();
        activeMotion = false;
        if (moving) requestRender();
      }

      function requestRender() {
        if (frameRequested) return;
        frameRequested = true;
        requestAnimationFrame(tick);
      }

      function resize() {
        viewportWidth = Math.max(1, window.innerWidth);
        viewportHeight = Math.max(1, window.innerHeight);
        const desiredDensity = Math.min(Math.max(1, window.devicePixelRatio || 1), MAX_DENSITY);
        const density = Math.min(desiredDensity,
          Math.sqrt(MAX_PIXELS / (viewportWidth * viewportHeight)));

        rasterWidth = Math.max(1, Math.round(viewportWidth * density));
        rasterHeight = Math.max(1, Math.round(viewportHeight * density));
        scaleX = rasterWidth / viewportWidth;
        scaleY = rasterHeight / viewportHeight;
        canvas.width = rasterWidth;
        canvas.height = rasterHeight;
        framebuffer = context.createImageData(rasterWidth, rasterHeight);
        bytes = framebuffer.data;
        pixels = new Uint32Array(bytes.buffer);
        backdrop = new Uint32Array(rasterWidth * rasterHeight);
        litBackdropPixels = new Uint32Array(rasterWidth * rasterHeight);
        litBackdropBytes = new Uint8Array(litBackdropPixels.buffer);
        containerPixels = new Uint32Array(rasterWidth * rasterHeight);
        containerBytes = new Uint8Array(containerPixels.buffer);
        litContainerPixels = new Uint32Array(rasterWidth * rasterHeight);
        litContainerBytes = new Uint8Array(litContainerPixels.buffer);
        prepareBackdrop();

        const previous = initialized ? shapes.map(shape => ({
          x: shape.x,
          y: shape.y,
          freeX: Math.max(0, previousViewportWidth - shape.w),
          freeY: Math.max(0, previousViewportHeight - shape.h)
        })) : null;
        previousViewportWidth = viewportWidth;
        previousViewportHeight = viewportHeight;

        const container = shapes[0];
        const pill = shapes[1];
        container.w = Math.min(340, Math.max(1, viewportWidth - 36));
        container.h = Math.min(220, Math.max(1, viewportHeight - 36));
        pill.w = Math.min(144, Math.max(1, viewportWidth - 24));
        pill.h = Math.min(48, Math.max(1, viewportHeight - 24));

        for (const shape of shapes) {
          shape.radius = Math.min(shape.radiusMax, shape.w * 0.5, shape.h * 0.5);
        }

        if (!initialized) {
          container.x = (viewportWidth - container.w) * 0.5;
          container.y = viewportHeight * 0.44 - container.h * 0.5;
          pill.x = (viewportWidth - pill.w) * 0.5;
          pill.y = viewportHeight * 0.44 + 160;
          initialized = true;
        }

        for (let i = 0; i < shapes.length; i++) {
          const shape = shapes[i];
          const freeX = Math.max(0, viewportWidth - shape.w);
          const freeY = Math.max(0, viewportHeight - shape.h);
          if (previous) {
            shape.x = previous[i].freeX > 0 ? previous[i].x / previous[i].freeX * freeX : freeX * 0.5;
            shape.y = previous[i].freeY > 0 ? previous[i].y / previous[i].freeY * freeY : freeY * 0.5;
          }
          shape.x = clamp(shape.x, 0, freeX);
          shape.y = clamp(shape.y, 0, freeY);
          shape.targetX = shape.x;
          shape.targetY = shape.y;
          shape.waveX = 0;
          shape.waveY = 0;
          shape.waveVX = 0;
          shape.waveVY = 0;
          prepareOptics(shape);
          shape.drawn = null;
        }

        lastFrameTime = null;
        drag = null;
        fullRedraw = true;
        requestRender();
      }

      function position(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function hitTest(x, y) {
        for (let i = shapes.length - 1; i >= 0; i--) {
          if (sampleSurface(shapes[i], x, y)) return shapes[i];
        }
        return null;
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (drag || (event.pointerType === 'mouse' && event.button !== 0)) return;
        const point = position(event);
        const shape = hitTest(point.x, point.y);
        if (!shape) return;

        shape.targetX = shape.x;
        shape.targetY = shape.y;
        drag = {
          id: event.pointerId,
          shape,
          offsetX: point.x - shape.x,
          offsetY: point.y - shape.y
        };
        lastFrameTime = null;
        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = 'grabbing';
        event.preventDefault();
      });

      canvas.addEventListener('pointermove', (event) => {
        const point = position(event);
        if (!drag || drag.id !== event.pointerId) {
          if (!drag && event.pointerType !== 'touch') {
            canvas.style.cursor = hitTest(point.x, point.y) ? 'grab' : 'default';
          }
          return;
        }

        const shape = drag.shape;
        const x = clamp(point.x - drag.offsetX, 0, Math.max(0, viewportWidth - shape.w));
        const y = clamp(point.y - drag.offsetY, 0, Math.max(0, viewportHeight - shape.h));
        if (x !== shape.targetX || y !== shape.targetY) {
          shape.targetX = x;
          shape.targetY = y;
          requestRender();
        }
      });

      function release(event) {
        if (!drag || drag.id !== event.pointerId) return;
        drag = null;
        const point = position(event);
        canvas.style.cursor = event.pointerType === 'touch'
          ? 'default' : hitTest(point.x, point.y) ? 'grab' : 'default';
      }

      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);
      canvas.addEventListener('lostpointercapture', release);
      window.addEventListener('blur', () => {
        drag = null;
        for (const shape of shapes) {
          shape.targetX = shape.x;
          shape.targetY = shape.y;
        }
        canvas.style.cursor = 'default';
      });
      window.LiquidGlass = Object.freeze({
        setBackdrop(image) {
          if (!image || !Number.isSafeInteger(image.width)
            || !Number.isSafeInteger(image.height)
            || image.width < 1 || image.height < 1
            || !image.data || image.data.length !== image.width * image.height * 4) {
            throw new TypeError('Expected an RGBA image with valid width and height');
          }
          backdropSource = {
            width: image.width,
            height: image.height,
            data: new Uint8ClampedArray(image.data)
          };
          if (backdrop) prepareBackdrop();
          fullRedraw = true;
          requestRender();
        },
        clearBackdrop() {
          backdropSource = null;
          if (backdrop) prepareBackdrop();
          fullRedraw = true;
          requestRender();
        }
      });
      window.addEventListener('resize', resize);
      resize();
    })();
  </script>
</body>
</html>
