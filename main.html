<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="color-scheme" content="dark">
  <title>Free</title>
  <style>
    :root {
      --background: #101010;
      --accent: #F47761;
      --ease: cubic-bezier(.22, 1, .36, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--background);
    }

    body {
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .scene {
      position: relative;
      display: grid;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      place-items: center;
      background: var(--background);
    }

    .glow {
      position: absolute;
      z-index: -1;
      inset: -12%;
      background: url("assets/free-banner.webp") center / cover no-repeat;
      filter: blur(46px) brightness(.58);
      opacity: .7;
      transform: scale(1.09);
      animation: breathe 16s ease-in-out infinite alternate;
      pointer-events: none;
    }

    .banner {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      max-width: none;
      object-fit: cover;
      object-position: center;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
      animation: reveal 1.5s var(--ease) both;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        filter: blur(7px);
        transform: scale(1.035);
      }
      to {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
    }

    @keyframes breathe {
      from {
        opacity: .52;
        transform: scale(1.09) translate3d(-.4%, 0, 0);
      }
      to {
        opacity: .76;
        transform: scale(1.14) translate3d(.4%, -.4%, 0);
      }
    }

    @media (max-aspect-ratio: 1/1) {
      .banner {
        width: 165%;
        height: auto;
        aspect-ratio: 16 / 9;
        object-fit: contain;
      }

      .glow {
        filter: blur(65px) brightness(.38);
        opacity: .7;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .glow, .banner {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="glow" aria-hidden="true"></div>
    <h1 class="sr-only">Free</h1>
    <img class="banner" src="assets/free-banner.webp" alt="" draggable="false" fetchpriority="high">
  </main>
</body>
</html>
