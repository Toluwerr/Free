<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title></title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body { background: #101113; }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <canvas id="surface" aria-label="Draggable pill and container"></canvas>
  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('surface');
      const context = canvas.getContext('2d', { alpha: false });
      if (!context) return;

      const MAX_PIXELS = 2_400_000;
      const MAX_DENSITY = 1.85;
      const IOR = 1.49;
      const BACKDROP_Z = -48;
      const F0 = Math.pow((IOR - 1) / (IOR + 1), 2);
      const COLOR_STEPS = 8192;
      const srgbLinear = new Float32Array(256);
      const linearSrgb = new Uint8Array(COLOR_STEPS + 1);
      for (let i = 0; i < 256; i++) {
        const c = i / 255;
        srgbLinear[i] = c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4;
      }
      for (let i = 0; i <= COLOR_STEPS; i++) {
        const c = i / COLOR_STEPS;
        linearSrgb[i] = Math.round(255 * (c <= 0.0031308
          ? c * 12.92 : 1.055 * c ** (1 / 2.4) - 0.055));
      }
      const encodeLinear = c => linearSrgb[Math.round(clamp(c, 0, 1) * COLOR_STEPS)];
      const LITTLE_ENDIAN = new Uint8Array(new Uint32Array([0x01020304]).buffer)[0] === 4;
      const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
      const pack = (r, g, b) => LITTLE_ENDIAN
        ? ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0
        : ((r << 24) | (g << 16) | (b << 8) | 255) >>> 0;

      const shapes = [
        { x: 0, y: 0, w: 340, h: 220, radius: 24, radiusMax: 24, shoulder: 40, depth: 7, crown: 7.5, drawn: null },
        { x: 0, y: 0, w: 144, h: 48, radius: 24, radiusMax: 24, shoulder: 22, depth: 4.5, crown: 2.2, drawn: null }
      ];

      let viewportWidth = 1;
      let viewportHeight = 1;
      let previousViewportWidth = 1;
      let previousViewportHeight = 1;
      let rasterWidth = 1;
      let rasterHeight = 1;
      let scaleX = 1;
      let scaleY = 1;
      let framebuffer = null;
      let pixels = null;
      let bytes = null;
      let backdrop = null;
      let backdropBytes = null;
      let containerPixels = null;
      let containerBytes = null;
      let initialized = false;
      let fullRedraw = true;
      let frameRequested = false;
      let drag = null;
      let backdropSource = null;

      function distanceToShape(x, y, shape) {
        const hx = shape.w * 0.5;
        const hy = shape.h * 0.5;
        const qx = Math.abs(x - shape.x - hx) - (hx - shape.radius);
        const qy = Math.abs(y - shape.y - hy) - (hy - shape.radius);
        return (qx > 0 && qy > 0 ? Math.hypot(qx, qy) : Math.max(qx, qy)) - shape.radius;
      }

      function sampleSurface(shape, x, y) {
        const hx = shape.w * 0.5;
        const hy = shape.h * 0.5;
        const dx = x - shape.x - hx;
        const dy = y - shape.y - hy;
        const qx = Math.abs(dx) - (hx - shape.radius);
        const qy = Math.abs(dy) - (hy - shape.radius);
        let distance;
        let nx;
        let ny;
        let contourCurvature = 0;

        if (qx > 0 && qy > 0) {
          const length = Math.hypot(qx, qy);
          const inverse = 1 / length;
          distance = length - shape.radius;
          nx = Math.sign(dx) * qx * inverse;
          ny = Math.sign(dy) * qy * inverse;
          contourCurvature = inverse;
        } else if (qx >= qy) {
          distance = qx - shape.radius;
          nx = Math.sign(dx) || 1;
          ny = 0;
        } else {
          distance = qy - shape.radius;
          nx = 0;
          ny = Math.sign(dy) || 1;
        }

        if (distance >= 0) return null;

        const shoulder = Math.max(0.01, Math.min(shape.shoulder, hx, hy));
        const inset = Math.min(-distance, shoulder);
        const t = inset / shoulder;
        const smooth = t * t * t * (10 + t * (-15 + 6 * t));
        const slope = 30 * t * t * (1 - t) * (1 - t) / shoulder;
        const u = dx / hx;
        const v = dy / hy;
        const u2 = Math.max(0, 1 - u * u);
        const v2 = Math.max(0, 1 - v * v);
        const crownWeight = u2 * v2;
        const crown = shape.crown * smooth * smooth;
        const height = shape.depth * 0.5 * smooth + crown * crownWeight;
        const radialSlope = (shape.depth * 0.5 + 2 * shape.crown * smooth * crownWeight) * slope;
        const gx = radialSlope * nx + crown * 2 * u * v2 / hx;
        const gy = radialSlope * ny + crown * 2 * v * u2 / hy;
        const inverseLength = 1 / Math.hypot(gx, gy, 1);
        const bend = inset < shoulder
          ? 30 * shape.depth * t * (1 - t) * (1 - 2 * t) / (shoulder * shoulder)
          : 0;

        return {
          distance,
          thickness: height * 2,
          frontZ: height,
          backZ: -height,
          frontNormal: [gx * inverseLength, gy * inverseLength, inverseLength],
          backNormal: [gx * inverseLength, gy * inverseLength, -inverseLength],
          edgeNormal: [nx, ny],
          meridianCurvature: bend * inverseLength * inverseLength * inverseLength,
          transverseCurvature: -radialSlope * contourCurvature * inverseLength
        };
      }

      function refract(ix, iy, iz, nx, ny, nz, ratio) {
        const cosine = -(ix * nx + iy * ny + iz * nz);
        const square = 1 - ratio * ratio * (1 - cosine * cosine);
        if (square < 0) return null;
        const perpendicular = ratio * cosine - Math.sqrt(square);
        return [
          ratio * ix + perpendicular * nx,
          ratio * iy + perpendicular * ny,
          ratio * iz + perpendicular * nz
        ];
      }

      function trace(shape, x, y, front) {
        const entry = refract(0, 0, -1,
          front.frontNormal[0], front.frontNormal[1], front.frontNormal[2], 1 / IOR);
        if (!entry || entry[2] >= -0.01) return null;

        let travel = front.thickness / -entry[2];
        let backX = x;
        let backY = y;
        let back = front;

        for (let i = 0; i < 4; i++) {
          backX = x + entry[0] * travel;
          backY = y + entry[1] * travel;
          back = sampleSurface(shape, backX, backY);
          if (!back) return null;

          const residual = front.frontZ + entry[2] * travel - back.backZ;
          if (Math.abs(residual) < 0.0005) break;
          const inverseNormalZ = 1 / back.frontNormal[2];
          const derivative = entry[2]
            - (back.frontNormal[0] * entry[0] + back.frontNormal[1] * entry[1]) * inverseNormalZ;
          if (Math.abs(derivative) < 0.02) return null;
          travel = Math.max(0, travel - residual / derivative);
        }

        backX = x + entry[0] * travel;
        backY = y + entry[1] * travel;
        back = sampleSurface(shape, backX, backY);
        if (!back) return null;
        if (Math.abs(front.frontZ + entry[2] * travel - back.backZ) > 0.06) return null;

        const exit = refract(entry[0], entry[1], entry[2],
          -back.backNormal[0], -back.backNormal[1], -back.backNormal[2], IOR);
        if (!exit || exit[2] >= -0.01) return null;

        const distance = (back.backZ - BACKDROP_Z) / -exit[2];
        const sourceX = backX + exit[0] * distance;
        const sourceY = backY + exit[1] * distance;
        return Number.isFinite(sourceX) && Number.isFinite(sourceY)
          ? [sourceX, sourceY] : null;
      }

      function smoothstep(a, b, x) {
        const t = clamp((x - a) / (b - a), 0, 1);
        return t * t * (3 - 2 * t);
      }

      function microfacet(nx, ny, nz, lx, ly, lz) {
        const ndl = Math.max(0, nx * lx + ny * ly + nz * lz);
        if (ndl <= 0) return 0;
        const hx = lx;
        const hy = ly;
        const hz = lz + 1;
        const inverseHalf = 1 / Math.hypot(hx, hy, hz);
        const ndh = Math.max(0, (nx * hx + ny * hy + nz * hz) * inverseHalf);
        const vdh = hz * inverseHalf;
        const ndv = Math.max(0.001, nz);
        const alpha = 0.12;
        const a2 = alpha * alpha;
        const d = ndh * ndh * (a2 - 1) + 1;
        const distribution = a2 / (Math.PI * d * d);
        const k = 0.17;
        const visibility = ndl / (ndl * (1 - k) + k)
          * ndv / (ndv * (1 - k) + k);
        const fresnel = F0 + (1 - F0) * (1 - vdh) ** 5;
        return distribution * visibility * fresnel * ndl / (4 * ndl * ndv + 0.0001);
      }

      function surfaceResponse(shape, x, y, surface) {
        const inset = -surface.distance;
        const rimWidth = Math.min(6, shape.h * 0.17, shape.radius * 0.28);
        const rim = 1 - smoothstep(0, rimWidth, inset);
        const edgeZ = 1 - rim * 0.965;
        const edgeXY = Math.sqrt(Math.max(0, 1 - edgeZ * edgeZ));
        const nx = surface.frontNormal[0] * (1 - rim) + surface.edgeNormal[0] * edgeXY;
        const ny = surface.frontNormal[1] * (1 - rim) + surface.edgeNormal[1] * edgeXY;
        const nz = surface.frontNormal[2] * (1 - rim) + edgeZ;
        const length = Math.hypot(nx, ny, nz);
        const cosine = clamp(nz / length, 0, 1);
        const reflectance = F0 + (1 - F0) * (1 - cosine) ** 5;
        const attenuation = Math.exp(-surface.thickness * 0.0014);
        const ox = nx / length;
        const oy = ny / length;
        const oz = nz / length;
        const key = microfacet(ox, oy, oz, -0.38, -0.46, 0.802);
        const fill = microfacet(ox, oy, oz, 0.62, 0.13, 0.773);
        return [reflectance, attenuation,
          key * 1.75 + fill * 0.34,
          key * 1.83 + fill * 0.38,
          key * 1.98 + fill * 0.44];
      }

      function prepareOptics(shape) {
        const columns = Math.ceil(shape.w * 1.25) + 1;
        const rows = Math.ceil(shape.h * 1.25) + 1;
        const stepX = shape.w / (columns - 1);
        const stepY = shape.h / (rows - 1);
        const values = new Float32Array(columns * rows * 2);
        const lighting = new Float32Array(columns * rows * 5);
        const valid = new Uint8Array(columns * rows);

        for (let y = 0; y < rows; y++) {
          const py = shape.y + Math.min(shape.h, y * stepY);
          for (let x = 0; x < columns; x++) {
            const px = shape.x + Math.min(shape.w, x * stepX);
            const surface = sampleSurface(shape, px, py);
            const lightIndex = (y * columns + x) * 5;
            if (!surface) {
              lighting[lightIndex] = 1;
              continue;
            }
            lighting.set(surfaceResponse(shape, px, py, surface), lightIndex);
            const hit = trace(shape, px, py, surface);
            if (!hit) continue;
            const cell = y * columns + x;
            const index = cell * 2;
            values[index] = hit[0] - px;
            values[index + 1] = hit[1] - py;
            valid[cell] = 1;
          }
        }

        for (let pass = 0; pass < 4; pass++) {
          let changes = 0;
          const revised = values.slice();
          const filled = valid.slice();
          for (let y = 1; y < rows - 1; y++) {
            for (let x = 1; x < columns - 1; x++) {
              const cell = y * columns + x;
              if (valid[cell] || lighting[cell * 5] === 1) continue;
              let sumX = 0;
              let sumY = 0;
              let count = 0;
              for (const neighbor of [cell - 1, cell + 1, cell - columns, cell + columns]) {
                if (!valid[neighbor]) continue;
                sumX += values[neighbor * 2];
                sumY += values[neighbor * 2 + 1];
                count++;
              }
              if (!count) continue;
              revised[cell * 2] = sumX / count;
              revised[cell * 2 + 1] = sumY / count;
              filled[cell] = 1;
              changes++;
            }
          }
          values.set(revised);
          valid.set(filled);
          if (!changes) break;
        }
        shape.optics = {
          columns, rows, values, lighting,
          inverseStepX: 1 / stepX,
          inverseStepY: 1 / stepY
        };
      }

      function opticalColor(shape, x, y, input, edgeDistance) {
        const optics = shape.optics;
        const cx = clamp((x - shape.x) * optics.inverseStepX, 0, optics.columns - 1);
        const cy = clamp((y - shape.y) * optics.inverseStepY, 0, optics.rows - 1);
        const x0 = Math.floor(cx);
        const y0 = Math.floor(cy);
        const x1 = Math.min(x0 + 1, optics.columns - 1);
        const y1 = Math.min(y0 + 1, optics.rows - 1);
        const fx = cx - x0;
        const fy = cy - y0;
        const w00 = (1 - fx) * (1 - fy);
        const w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy;
        const w11 = fx * fy;
        const a = (y0 * optics.columns + x0) * 2;
        const b = (y0 * optics.columns + x1) * 2;
        const c = (y1 * optics.columns + x0) * 2;
        const d = (y1 * optics.columns + x1) * 2;
        const values = optics.values;
        const offsetX = values[a] * w00 + values[b] * w10
          + values[c] * w01 + values[d] * w11;
        const offsetY = values[a + 1] * w00 + values[b + 1] * w10
          + values[c + 1] * w01 + values[d + 1] * w11;
        const edgeFade = smoothstep(0, 2.6, -edgeDistance);
        const base = sampleColor(x + offsetX * edgeFade, y + offsetY * edgeFade, input);
        const lighting = optics.lighting;
        const ia = (y0 * optics.columns + x0) * 5;
        const ib = (y0 * optics.columns + x1) * 5;
        const ic = (y1 * optics.columns + x0) * 5;
        const id = (y1 * optics.columns + x1) * 5;
        let reflectance;
        let attenuation;
        let lightR;
        let lightG;
        let lightB;
        if (edgeDistance > -7) {
          const surface = sampleSurface(shape, x, y);
          if (!surface) return base;
          const direct = surfaceResponse(shape, x, y, surface);
          reflectance = direct[0];
          attenuation = direct[1];
          lightR = direct[2];
          lightG = direct[3];
          lightB = direct[4];
        } else {
          reflectance = lighting[ia] * w00 + lighting[ib] * w10
            + lighting[ic] * w01 + lighting[id] * w11;
          attenuation = lighting[ia + 1] * w00 + lighting[ib + 1] * w10
            + lighting[ic + 1] * w01 + lighting[id + 1] * w11;
          lightR = lighting[ia + 2] * w00 + lighting[ib + 2] * w10
            + lighting[ic + 2] * w01 + lighting[id + 2] * w11;
          lightG = lighting[ia + 3] * w00 + lighting[ib + 3] * w10
            + lighting[ic + 3] * w01 + lighting[id + 3] * w11;
          lightB = lighting[ia + 4] * w00 + lighting[ib + 4] * w10
            + lighting[ic + 4] * w01 + lighting[id + 4] * w11;
        }
        const transmission = (1 - reflectance) * attenuation;
        const red = LITTLE_ENDIAN ? base & 255 : base >>> 24;
        const green = LITTLE_ENDIAN ? (base >>> 8) & 255 : (base >>> 16) & 255;
        const blue = LITTLE_ENDIAN ? (base >>> 16) & 255 : (base >>> 8) & 255;
        return pack(
          encodeLinear(srgbLinear[red] * transmission + reflectance * 0.105 + lightR),
          encodeLinear(srgbLinear[green] * transmission + reflectance * 0.112 + lightG),
          encodeLinear(srgbLinear[blue] * transmission + reflectance * 0.125 + lightB)
        );
      }

      function snapshot(shape) {
        return { x: shape.x, y: shape.y, w: shape.w, h: shape.h };
      }

      function bounds(shape) {
        const x0 = clamp(Math.floor(shape.x * scaleX) - 2, 0, rasterWidth);
        const y0 = clamp(Math.floor(shape.y * scaleY) - 2, 0, rasterHeight);
        const x1 = clamp(Math.ceil((shape.x + shape.w) * scaleX) + 2, 0, rasterWidth);
        const y1 = clamp(Math.ceil((shape.y + shape.h) * scaleY) + 2, 0, rasterHeight);
        return x1 > x0 && y1 > y0 ? { x0, y0, x1, y1 } : null;
      }

      function mergeRectangles(rectangles) {
        const result = [];
        for (const rect of rectangles) {
          if (!rect) continue;
          let joined = rect;
          for (let i = 0; i < result.length;) {
            const current = result[i];
            if (joined.x0 <= current.x1 && current.x0 <= joined.x1
              && joined.y0 <= current.y1 && current.y0 <= joined.y1) {
              joined = {
                x0: Math.min(joined.x0, current.x0),
                y0: Math.min(joined.y0, current.y0),
                x1: Math.max(joined.x1, current.x1),
                y1: Math.max(joined.y1, current.y1)
              };
              result.splice(i, 1);
              i = 0;
            } else {
              i++;
            }
          }
          result.push(joined);
        }
        return result;
      }

      function prepareBackdrop() {
        if (!backdropSource) {
          for (let y = 0; y < rasterHeight; y++) {
            const sy = (y + 0.5) / scaleY;
            for (let x = 0; x < rasterWidth; x++) {
              const sx = (x + 0.5) / scaleX;
              const a = sx * 0.90 + sy * 0.31;
              const b = sy * 0.88 - sx * 0.19;
              const major = Math.abs(a - Math.round(a / 78) * 78);
              const minor = Math.abs(b - Math.round(b / 126) * 126);
              const stroke = 11 * clamp((1.8 - major) / 1.25, 0, 1)
                + 5 * clamp((1.2 - minor) / 0.9, 0, 1);
              const low = 2.3 * Math.sin(a / 170) + 1.9 * Math.sin(b / 114);
              const value = Math.round(20 + low + stroke);
              backdrop[y * rasterWidth + x] = pack(value, value + 1, value + 3);
            }
          }
          return;
        }
        const { width: sw, height: sh, data } = backdropSource;
        const rowScale = sh / rasterHeight;
        const columnScale = sw / rasterWidth;
        for (let y = 0; y < rasterHeight; y++) {
          const sy = clamp((y + 0.5) * rowScale - 0.5, 0, sh - 1);
          const top = Math.floor(sy);
          const bottom = Math.min(top + 1, sh - 1);
          const fy = sy - top;
          for (let x = 0; x < rasterWidth; x++) {
            const sx = clamp((x + 0.5) * columnScale - 0.5, 0, sw - 1);
            const left = Math.floor(sx);
            const right = Math.min(left + 1, sw - 1);
            const fx = sx - left;
            const o00 = (top * sw + left) * 4;
            const o10 = (top * sw + right) * 4;
            const o01 = (bottom * sw + left) * 4;
            const o11 = (bottom * sw + right) * 4;
            const w00 = (1 - fx) * (1 - fy);
            const w10 = fx * (1 - fy);
            const w01 = (1 - fx) * fy;
            const w11 = fx * fy;
            backdrop[y * rasterWidth + x] = pack(
              Math.round(data[o00] * w00 + data[o10] * w10 + data[o01] * w01 + data[o11] * w11),
              Math.round(data[o00 + 1] * w00 + data[o10 + 1] * w10 + data[o01 + 1] * w01 + data[o11 + 1] * w11),
              Math.round(data[o00 + 2] * w00 + data[o10 + 2] * w10 + data[o01 + 2] * w01 + data[o11 + 2] * w11)
            );
          }
        }
      }

      function copyRegion(target, source, area) {
        for (let y = area.y0; y < area.y1; y++) {
          const start = y * rasterWidth + area.x0;
          target.set(source.subarray(start, start + area.x1 - area.x0), start);
        }
      }

      function sampleColor(x, y, input) {
        const sampleX = clamp(x * scaleX - 0.5, 0, rasterWidth - 1);
        const sampleY = clamp(y * scaleY - 0.5, 0, rasterHeight - 1);
        const left = Math.floor(sampleX);
        const top = Math.floor(sampleY);
        const right = Math.min(left + 1, rasterWidth - 1);
        const bottom = Math.min(top + 1, rasterHeight - 1);
        const fx = sampleX - left;
        const fy = sampleY - top;
        const w00 = (1 - fx) * (1 - fy);
        const w10 = fx * (1 - fy);
        const w01 = (1 - fx) * fy;
        const w11 = fx * fy;
        const i00 = (top * rasterWidth + left) * 4;
        const i10 = (top * rasterWidth + right) * 4;
        const i01 = (bottom * rasterWidth + left) * 4;
        const i11 = (bottom * rasterWidth + right) * 4;
        return pack(
          Math.round(input[i00] * w00 + input[i10] * w10
            + input[i01] * w01 + input[i11] * w11),
          Math.round(input[i00 + 1] * w00 + input[i10 + 1] * w10
            + input[i01 + 1] * w01 + input[i11 + 1] * w11),
          Math.round(input[i00 + 2] * w00 + input[i10 + 2] * w10
            + input[i01 + 2] * w01 + input[i11 + 2] * w11)
        );
      }

      function paintShape(shape, dirty, input, output) {
        const area = bounds(shape);
        if (!area) return;

        const x0 = Math.max(area.x0, dirty.x0);
        const y0 = Math.max(area.y0, dirty.y0);
        const x1 = Math.min(area.x1, dirty.x1);
        const y1 = Math.min(area.y1, dirty.y1);
        if (x0 >= x1 || y0 >= y1) return;

        const halfDiagonal = 0.5 * Math.hypot(1 / scaleX, 1 / scaleY);
        const reciprocalX = 1 / scaleX;
        const reciprocalY = 1 / scaleY;
        const fineRaster = Math.min(scaleX, scaleY) >= 1.45;

        for (let py = y0; py < y1; py++) {
          const cy = (py + 0.5) * reciprocalY;
          for (let px = x0; px < x1; px++) {
            const cx = (px + 0.5) * reciprocalX;
            const signed = distanceToShape(cx, cy, shape);
            if (signed >= halfDiagonal) continue;

            const samples = signed > -halfDiagonal ? (fineRaster ? 2 : 4)
              : signed > -8 && !fineRaster ? 2 : 1;
            const count = samples * samples;
            let totalR = 0;
            let totalG = 0;
            let totalB = 0;
            let covered = 0;

            for (let sy = 0; sy < samples; sy++) {
              const y = cy + (sy + 0.5 - samples * 0.5) * reciprocalY / samples;
              for (let sx = 0; sx < samples; sx++) {
                const x = cx + (sx + 0.5 - samples * 0.5) * reciprocalX / samples;
                const distance = distanceToShape(x, y, shape);
                if (distance >= 0) continue;
                covered++;
                const color = opticalColor(shape, x, y, input, distance);
                totalR += LITTLE_ENDIAN ? color & 255 : color >>> 24;
                totalG += LITTLE_ENDIAN ? (color >>> 8) & 255 : (color >>> 16) & 255;
                totalB += LITTLE_ENDIAN ? (color >>> 16) & 255 : (color >>> 8) & 255;
              }
            }

            if (!covered) continue;
            const outIndex = (py * rasterWidth + px) * 4;
            const inverse = 1 / count;
            const uncovered = (count - covered) * inverse;
            output[outIndex] = Math.round(output[outIndex] * uncovered + totalR * inverse);
            output[outIndex + 1] = Math.round(output[outIndex + 1] * uncovered + totalG * inverse);
            output[outIndex + 2] = Math.round(output[outIndex + 2] * uncovered + totalB * inverse);
            output[outIndex + 3] = 255;
          }
        }
      }

      function render() {
        frameRequested = false;
        if (!framebuffer) return;

        const dirty = [];
        if (fullRedraw) {
          dirty.push({ x0: 0, y0: 0, x1: rasterWidth, y1: rasterHeight });
        } else {
          for (const shape of shapes) {
            const old = shape.drawn;
            if (!old || old.x !== shape.x || old.y !== shape.y
              || old.w !== shape.w || old.h !== shape.h) {
              if (old) dirty.push(bounds(old));
              dirty.push(bounds(shape));
            }
          }
        }

        for (const area of mergeRectangles(dirty)) {
          copyRegion(containerPixels, backdrop, area);
          paintShape(shapes[0], area, backdropBytes, containerBytes);
          copyRegion(pixels, containerPixels, area);
          paintShape(shapes[1], area, containerBytes, bytes);
          context.putImageData(framebuffer, 0, 0,
            area.x0, area.y0, area.x1 - area.x0, area.y1 - area.y0);
        }

        for (const shape of shapes) shape.drawn = snapshot(shape);
        fullRedraw = false;
      }

      function requestRender() {
        if (frameRequested) return;
        frameRequested = true;
        requestAnimationFrame(render);
      }

      function resize() {
        viewportWidth = Math.max(1, window.innerWidth);
        viewportHeight = Math.max(1, window.innerHeight);
        const desiredDensity = Math.min(Math.max(1, window.devicePixelRatio || 1), MAX_DENSITY);
        const density = Math.min(desiredDensity,
          Math.sqrt(MAX_PIXELS / (viewportWidth * viewportHeight)));

        rasterWidth = Math.max(1, Math.round(viewportWidth * density));
        rasterHeight = Math.max(1, Math.round(viewportHeight * density));
        scaleX = rasterWidth / viewportWidth;
        scaleY = rasterHeight / viewportHeight;
        canvas.width = rasterWidth;
        canvas.height = rasterHeight;
        framebuffer = context.createImageData(rasterWidth, rasterHeight);
        bytes = framebuffer.data;
        pixels = new Uint32Array(bytes.buffer);
        backdrop = new Uint32Array(rasterWidth * rasterHeight);
        backdropBytes = new Uint8Array(backdrop.buffer);
        containerPixels = new Uint32Array(rasterWidth * rasterHeight);
        containerBytes = new Uint8Array(containerPixels.buffer);
        prepareBackdrop();

        const previous = initialized ? shapes.map(shape => ({
          x: shape.x,
          y: shape.y,
          freeX: Math.max(0, previousViewportWidth - shape.w),
          freeY: Math.max(0, previousViewportHeight - shape.h)
        })) : null;
        previousViewportWidth = viewportWidth;
        previousViewportHeight = viewportHeight;

        const container = shapes[0];
        const pill = shapes[1];
        container.w = Math.min(340, Math.max(1, viewportWidth - 36));
        container.h = Math.min(220, Math.max(1, viewportHeight - 36));
        pill.w = Math.min(144, Math.max(1, viewportWidth - 24));
        pill.h = Math.min(48, Math.max(1, viewportHeight - 24));

        for (const shape of shapes) {
          shape.radius = Math.min(shape.radiusMax, shape.w * 0.5, shape.h * 0.5);
        }

        if (!initialized) {
          container.x = (viewportWidth - container.w) * 0.5;
          container.y = viewportHeight * 0.44 - container.h * 0.5;
          pill.x = (viewportWidth - pill.w) * 0.5;
          pill.y = viewportHeight * 0.44 + 160;
          initialized = true;
        }

        for (let i = 0; i < shapes.length; i++) {
          const shape = shapes[i];
          const freeX = Math.max(0, viewportWidth - shape.w);
          const freeY = Math.max(0, viewportHeight - shape.h);
          if (previous) {
            shape.x = previous[i].freeX > 0 ? previous[i].x / previous[i].freeX * freeX : freeX * 0.5;
            shape.y = previous[i].freeY > 0 ? previous[i].y / previous[i].freeY * freeY : freeY * 0.5;
          }
          shape.x = clamp(shape.x, 0, freeX);
          shape.y = clamp(shape.y, 0, freeY);
          prepareOptics(shape);
          shape.drawn = null;
        }

        fullRedraw = true;
        requestRender();
      }

      function position(event) {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      }

      function hitTest(x, y) {
        for (let i = shapes.length - 1; i >= 0; i--) {
          if (sampleSurface(shapes[i], x, y)) return shapes[i];
        }
        return null;
      }

      canvas.addEventListener('pointerdown', (event) => {
        if (drag || (event.pointerType === 'mouse' && event.button !== 0)) return;
        const point = position(event);
        const shape = hitTest(point.x, point.y);
        if (!shape) return;

        drag = {
          id: event.pointerId,
          shape,
          offsetX: point.x - shape.x,
          offsetY: point.y - shape.y
        };
        canvas.setPointerCapture(event.pointerId);
        canvas.style.cursor = 'grabbing';
        event.preventDefault();
      });

      canvas.addEventListener('pointermove', (event) => {
        const point = position(event);
        if (!drag || drag.id !== event.pointerId) {
          if (!drag && event.pointerType !== 'touch') {
            canvas.style.cursor = hitTest(point.x, point.y) ? 'grab' : 'default';
          }
          return;
        }

        const shape = drag.shape;
        const x = clamp(point.x - drag.offsetX, 0, Math.max(0, viewportWidth - shape.w));
        const y = clamp(point.y - drag.offsetY, 0, Math.max(0, viewportHeight - shape.h));
        if (x !== shape.x || y !== shape.y) {
          shape.x = x;
          shape.y = y;
          requestRender();
        }
      });

      function release(event) {
        if (!drag || drag.id !== event.pointerId) return;
        drag = null;
        const point = position(event);
        canvas.style.cursor = event.pointerType === 'touch'
          ? 'default' : hitTest(point.x, point.y) ? 'grab' : 'default';
      }

      canvas.addEventListener('pointerup', release);
      canvas.addEventListener('pointercancel', release);
      canvas.addEventListener('lostpointercapture', release);
      window.addEventListener('blur', () => { drag = null; canvas.style.cursor = 'default'; });
      window.LiquidGlass = Object.freeze({
        setBackdrop(image) {
          if (!image || !Number.isSafeInteger(image.width)
            || !Number.isSafeInteger(image.height)
            || image.width < 1 || image.height < 1
            || !image.data || image.data.length !== image.width * image.height * 4) {
            throw new TypeError('Expected an RGBA image with valid width and height');
          }
          backdropSource = {
            width: image.width,
            height: image.height,
            data: new Uint8ClampedArray(image.data)
          };
          if (backdrop) prepareBackdrop();
          fullRedraw = true;
          requestRender();
        },
        clearBackdrop() {
          backdropSource = null;
          if (backdrop) prepareBackdrop();
          fullRedraw = true;
          requestRender();
        }
      });
      window.addEventListener('resize', resize);
      resize();
    })();
  </script>
</body>
</html>
