<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="color-scheme" content="dark">
  <title>Free</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; background: #101010; }
    body { overflow: hidden; }
    main {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      background: #101010;
    }
    .art {
      display: block;
      width: 100%;
      height: 100vh;
      height: 100svh;
      flex-shrink: 0;
      overflow: visible;
    }
    .wordmark {
      animation: appear 1.15s cubic-bezier(.22, 1, .36, 1) both;
      transform-box: fill-box;
      transform-origin: center;
    }
    .ribbon--first { animation: drift-left 22s ease-in-out infinite alternate; }
    .ribbon--second { animation: drift-right 20s ease-in-out infinite alternate; }
    .ribbon--third { animation: drift-bottom 24s ease-in-out infinite alternate; }
    @keyframes appear {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes drift-left {
      from { transform: translate(0, 0); }
      to { transform: translate(-4px, 3px); }
    }
    @keyframes drift-right {
      from { transform: translate(0, 0); }
      to { transform: translate(3px, -3px); }
    }
    @keyframes drift-bottom {
      from { transform: translate(0, 0); }
      to { transform: translate(0, 5px); }
    }
    @media (max-aspect-ratio: 1/1) {
      .art { width: 165%; height: auto; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wordmark, .ribbon { animation: none; }
    }
  </style>
</head>
